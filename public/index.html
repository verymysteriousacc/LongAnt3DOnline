<!DOCTYPE html>                                                 <html lang="en">                                                <head>                                                          <meta charset="UTF-8">                                          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">                            <title>RGBAnt 3D</title>                                        <script type="importmap">                                       {                                                                 "imports": {                                                      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"                                                   }                                                             }                                                               </script>                                                       <style>                                                         *{box-sizing:border-box}                                        html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#e8efff;font-family:Arial,sans-serif}        canvas{display:block}                                           #ui{position:fixed;inset:0;pointer-events:none}                 #top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}                        .panel{background:rgba(12,17,28,.9);border:1px solid #26334a;border-radius:10px;padding:10px}                                   #brand{font-size:14px;font-weight:bold;letter-spacing:2px}      #status{font-size:10px;color:#9eabc2;margin-top:4px}            #stats{font-size:10px;text-align:right;color:#aab9d4;line-height:1.7}                                                           #bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;gap:9px}                          #controls{display:flex;gap:7px;flex-wrap:wrap;pointer-events:auto}                                                              button{background:#18243a;border:1px solid #344767;color:#e8efff;padding:10px 13px;border-radius:7px;font-weight:bold;font-size:12px}                                                           #speedbox{display:flex;align-items:center;gap:10px;pointer-events:auto}                                                         #speedbox input{flex:1;min-width:0;accent-color:#60a5fa}        #speedvalue{font-size:12px;min-width:65px;text-align:right}     #hint{font-size:10px;color:#7f91ad;text-align:center}           #loading{position:absolute;inset:0;display:grid;place-items:center;background:#080b12;font-size:13px;letter-spacing:1px;z-index:5;padding:25px;text-align:center;white-space:pre-wrap}          </style>                                                        </head>                                                         <body>                                                          <div id="loading">INITIALIZING 3D WORLD...</div>                <div id="ui">                                                   <div id="top">                                                  <div class="panel">                                             <div id="brand">RGBAnt / 3D</div>                               <div id="status">128³ SIMULATION</div>                          </div>                                                          <div class="panel" id="stats">                                  <div id="moves">MOVES 0</div>                                   <div id="voxels">VOXELS 0</div>                                 <div id="ants">ANTS 1 / 25</div>                                </div>                                                          </div>                                                          <div id="bottom">                                               <div class="panel" id="speedbox">                               <span>SPEED</span>                                              <input id="speed" type="range" min="1" max="256" value="1">     <span id="speedvalue">1 / 256</span>                            </div>                                                          <div id="controls">                                             <button id="add">+ ANT</button>                                 <button id="remove">- ANT</button>                              <button id="reset">RESET</button>                               <button id="home">CENTER</button>                               </div>                                                          <div class="panel" id="hint">DRAG TO ROTATE · PINCH TO ZOOM · TWO FINGERS TO PAN</div>                                          </div>                                                          </div>                                                          <script type="module">                                          const loading=document.getElementById("loading");               const status=document.getElementById("status");                 function fail(error){                                            loading.textContent="INITIALIZATION ERROR\n"+String(error);     status.textContent="ERROR";                                    }                                                               window.addEventListener("error",e=>fail(e.message));            window.addEventListener("unhandledrejection",e=>fail(e.reason));                                                                try{                                                             const THREE=await import("three");                              const {OrbitControls}=await import("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js");                                                                        const SIZE=128;                                                 const HALF=63.5;                                                const COLORS=[0xff4545,0xff922e,0xffdc42,0x7de35c,0x20d6a2,0x28c8ed,0x3985ff,0x8d63ff,0xd65cff,0xff62bd];                                                                                       const scene=new THREE.Scene();                                  scene.background=new THREE.Color(0x080b12);                     const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);                                                    camera.position.set(155,145,175);                                                                                               const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:"high-performance"});                                   renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));        renderer.setSize(innerWidth,innerHeight);                       renderer.outputColorSpace=THREE.SRGBColorSpace;                 document.body.appendChild(renderer.domElement);                                                                                 const controls=new OrbitControls(camera,renderer.domElement);   controls.target.set(0,0,0);                                     controls.enableDamping=true;                                    controls.dampingFactor=.07;                                     controls.minDistance=8;                                         controls.maxDistance=350;                                      
 scene.add(new THREE.AmbientLight(0xffffff,1.3));                const light=new THREE.DirectionalLight(0xffffff,1.5);
 light.position.set(100,180,120);                                scene.add(light);
                                                                 const grid=new THREE.GridHelper(SIZE,16,0x263650,0x172338);
 grid.position.y=-HALF-.5;                                       scene.add(grid);
                                                                 scene.add(new THREE.Box3Helper(new THREE.Box3(
  new THREE.Vector3(-HALF-.5,-HALF-.5,-HALF-.5),                  new THREE.Vector3(HALF+.5,HALF+.5,HALF+.5)
 ),0x263b58));                                                  
 const cube=new THREE.BoxGeometry(.94,.94,.94);                  const materials=COLORS.map(color=>new THREE.MeshStandardMaterial({color,roughness:.8,metalness:.02}));                          const meshes=[];
 const capacities=Array(10).fill(64);                            const slots=Array.from({length:10},()=>[]);
 const cellMap=new Map();                                        const dummy=new THREE.Object3D();
                                                                 function createMesh(color,capacity){                             const mesh=new THREE.InstancedMesh(cube,materials[color],capacity);
  mesh.count=0;                                                   mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled=false;                                       scene.add(mesh);
  return mesh;                                                   }
 for(let i=0;i<10;i++)meshes.push(createMesh(i,64));            
 function growMesh(color,required){                               const old=meshes[color];
  let capacity=capacities[color];                                 while(capacity<required)capacity*=2;
  const next=createMesh(color,capacity);                          for(let i=0;i<old.count;i++){
   old.getMatrixAt(i,dummy.matrix);                                next.setMatrixAt(i,dummy.matrix);
  }                                                               next.count=old.count;
  next.instanceMatrix.needsUpdate=true;                           scene.remove(old);                                              old.dispose();                                                  meshes[color]=next;
  capacities[color]=capacity;                                    }
                                                                 function key(x,y,z){return (x*SIZE+y)*SIZE+z}
                                                                 function removeCell(k){                                          const item=cellMap.get(k);                                      if(!item)return;
  const list=slots[item.color];                                   const mesh=meshes[item.color];
  const last=list.length-1;                                       if(item.slot!==last){
   const moved=list[last];                                         list[item.slot]=moved;
   cellMap.get(moved).slot=item.slot;                              mesh.getMatrixAt(last,dummy.matrix);
   mesh.setMatrixAt(item.slot,dummy.matrix);                      }
  list.pop();                                                     mesh.count=list.length;
  mesh.instanceMatrix.needsUpdate=true;                           cellMap.delete(k);
 }                                                              
 function setCell(x,y,z,color){                                   const k=key(x,y,z);
  const old=cellMap.get(k);                                       if(old&&old.color===color)return;                               if(old)removeCell(k);                                           const list=slots[color];
  if(list.length>=capacities[color])growMesh(color,list.length+1);
  const mesh=meshes[color];                                       const slot=list.length;
  dummy.position.set(x-HALF,y-HALF,z-HALF);                       dummy.rotation.set(0,0,0);
  dummy.scale.set(1,1,1);                                         dummy.updateMatrix();
  mesh.setMatrixAt(slot,dummy.matrix);                            mesh.count=slot+1;
  mesh.instanceMatrix.needsUpdate=true;                           list.push(k);
  cellMap.set(k,{color,slot});                                   }
                                                                 function clearCells(){
  cellMap.clear();                                                for(let i=0;i<10;i++){
   slots[i].length=0;                                              meshes[i].count=0;
   meshes[i].instanceMatrix.needsUpdate=true;                     }
 }                                                              
 const antGeometry=new THREE.SphereGeometry(.55,8,6);            const antMaterials=Array.from({length:25},(_,i)=>new THREE.MeshStandardMaterial({                                                color:new THREE.Color().setHSL(i/25,.9,.65),
  emissive:new THREE.Color().setHSL(i/25,.9,.2)                  }));
 const antMeshes=[];                                             for(let i=0;i<25;i++){                                           const mesh=new THREE.Mesh(antGeometry,antMaterials[i]);         mesh.visible=false;
  scene.add(mesh);                                                antMeshes.push(mesh);
 }                                                                                                                               let revision=-1;                                                let speed=1;                                                    let accumulator=0;                                              let lastFrame=performance.now();                                let lastRequest=0;                                              let busy=false;                                                                                                                 function applyData(data){                                        if(data.snapshot){                                               clearCells();
   for(const v of data.snapshot)setCell(v[0],v[1],v[2],v[3]);     }else if(data.changes){
   for(const v of data.changes)setCell(v[0],v[1],v[2],v[3]);      }
  if(data.ants){                                                   for(let i=0;i<25;i++){                                           const mesh=antMeshes[i];                                        const a=data.ants[i];
    if(!a){mesh.visible=false;continue}                             mesh.visible=true;
    mesh.position.set(a[0]-HALF,a[1]-HALF,a[2]-HALF);              }
  }                                                               revision=data.revision;
  document.getElementById("moves").textContent="MOVES "+data.moves.toLocaleString();
  document.getElementById("voxels").textContent="VOXELS "+data.voxelCount.toLocaleString();
  document.getElementById("ants").textContent="ANTS "+data.antCount+" / 25";                                                     }                                                              
 async function requestTick(count=0){                             if(busy)return;
  busy=true;                                                      try{                                                             const response=await fetch("/api/tick",{                         method:"POST",
    headers:{"Content-Type":"application/json"},                    body:JSON.stringify({count,since:revision})
   });                                                             if(!response.ok)throw new Error("API HTTP "+response.status);
   applyData(await response.json());                              }finally{busy=false}
 }                                                              
 async function action(path){                                     if(busy)return;
  busy=true;                                                      try{                                                             const response=await fetch(path,{method:"POST"});               if(!response.ok)throw new Error("API HTTP "+response.status);
   applyData(await response.json());                              }finally{busy=false}
 }                                                              
 document.getElementById("speed").addEventListener("input",e=>{   speed=Number(e.target.value);                                   document.getElementById("speedvalue").textContent=speed+" / 256";
 });                                                             document.getElementById("add").onclick=()=>action("/api/add").catch(fail);                                                      document.getElementById("remove").onclick=()=>action("/api/remove").catch(fail);                                                document.getElementById("reset").onclick=()=>action("/api/reset").catch(fail);                                                  document.getElementById("home").onclick=()=>{
  camera.position.set(155,145,175);                               controls.target.set(0,0,0);
  controls.update();                                             };
                                                                 await requestTick(0);
 loading.remove();                                               status.textContent="10 COLORS · 128³ WORLD";                                                                                    function animate(now){
  requestAnimationFrame(animate);                                 const dt=Math.min((now-lastFrame)/1000,.25);                    lastFrame=now;                                                  accumulator=Math.min(accumulator+dt*speed,256);                 if(now-lastRequest>=50&&!busy){                                  const count=Math.min(256,Math.floor(accumulator));
   if(count>0){                                                     accumulator-=count;                                             lastRequest=now;                                                requestTick(count).catch(fail);                                }                                                              }                                                               controls.update();                                              renderer.render(scene,camera);                                 }                                                               requestAnimationFrame(animate);
                                                                 addEventListener("resize",()=>{                                  camera.aspect=innerWidth/innerHeight;                           camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);                       renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
 });                                                            }catch(error){                                                   fail(error);                                                   }
</script>                                                       </body>
  </html>
