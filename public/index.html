
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RGBAnt 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b12;color:#e8efff;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:#101722eF;border:1px solid #26364b;border-radius:10px;padding:12px;backdrop-filter:blur(12px)}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#brand{font-weight:900;font-size:18px;letter-spacing:2px}
#status{font-size:11px;color:#8fa8c9;margin-top:4px}
#tag{font-size:11px;color:#61d6ff;margin-top:5px}
#controls{position:absolute;bottom:12px;left:12px;width:min(340px,calc(100% - 24px))}
button{background:#1d3047;border:1px solid #38516f;color:#eaf4ff;padding:10px 12px;border-radius:7px;font-weight:bold;cursor:pointer}
button:active{background:#31577e}
button:disabled{opacity:.4}
.buttons{display:flex;gap:7px;flex-wrap:wrap}
.buttons button{flex:1}
#speedrow{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
#speed{width:100%;accent-color:#53caff}
#speedvalue{min-width:35px;text-align:right;font-size:12px}
#stats{font-size:11px;color:#8fa8c9;margin-top:8px}
#chat{position:absolute;right:12px;top:76px;width:min(340px,calc(100% - 24px));height:300px;display:flex;flex-direction:column}
#chathead{font-weight:bold;font-size:12px;letter-spacing:1px;margin-bottom:8px}
#messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:7px;font-size:12px;min-height:0}
.msg{overflow-wrap:anywhere;line-height:1.4}
.msg .who{color:#61d6ff;font-weight:bold}
.msg.system{color:#8a9bb0;font-style:italic}
#chatform{display:flex;gap:6px;margin-top:10px}
#chatinput{min-width:0;flex:1;background:#080e18;border:1px solid #30445d;border-radius:7px;color:white;padding:10px;outline:none}
#chatinput:focus{border-color:#53caff}
#hint{position:absolute;bottom:12px;right:12px;color:#8295ad;font-size:10px;text-align:right;pointer-events:none}
#mobilechat{display:none}
@media(max-width:600px){
#chat{display:none;top:auto;bottom:76px;right:12px;height:260px}
#chat.open{display:flex}
#mobilechat{display:block}
#hint{display:none}
#brand{font-size:15px}
#controls{width:calc(100% - 24px)}
}
</style>
</head>
<body>
<div id="ui">
  <div id="top">
    <div class="panel">
      <div id="brand">RGBAnt <span style="color:#53caff">3D</span></div>
      <div id="status">CONNECTING...</div>
      <div id="tag">TAG: GENERATING...</div>
    </div>
    <div class="buttons">
      <button id="invite">INVITE</button>
      <button id="mobilechat">CHAT</button>
      <button id="leave">LEAVE</button>
    </div>
  </div>
  <div id="chat" class="panel">
    <div id="chathead">ROOM CHAT</div>
    <div id="messages"></div>
    <form id="chatform">
      <input id="chatinput" maxlength="180" placeholder="Message..." autocomplete="off">
      <button type="submit">SEND</button>
    </form>
  </div>
  <div id="controls" class="panel">
    <div class="buttons">
      <button id="reset">RESET WORLD</button>
      <button id="center">CENTER VIEW</button>
    </div>
    <div id="speedrow">
      <label for="speed">SPEED</label>
      <input id="speed" type="range" min="1" max="256" value="1">
      <span id="speedvalue">1</span>
    </div>
    <div id="stats">MOVES: 0 | VOXELS: 0 | ANTS: 0</div>
  </div>
  <div id="hint">DRAG: ROTATE · PINCH: ZOOM · TWO FINGERS: PAN</div>
</div>
<script type="module">
const THREE=await import("three");
const {OrbitControls}=await import("https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js");

const SIZE=128;
const COLORS=10;
const palette=[
0x50c8ff,0xff5470,0x9b75ff,0x55e6a5,0xffc857,
0xff8b45,0x65a4ff,0xe879f9,0xd5ed65,0xffffff
];

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080b12);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.set(170,150,190);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.target.set(SIZE/2,SIZE/2,SIZE/2);
controls.minDistance=20;
controls.maxDistance=500;

scene.add(new THREE.AmbientLight(0xffffff,.8));
const light=new THREE.DirectionalLight(0xffffff,1.3);
light.position.set(100,180,120);
scene.add(light);

const grid=new THREE.GridHelper(SIZE,16,0x28415b,0x18283b);
grid.position.set(SIZE/2,-.5,SIZE/2);
scene.add(grid);

const edges=new THREE.LineSegments(
new THREE.EdgesGeometry(new THREE.BoxGeometry(SIZE,SIZE,SIZE)),
new THREE.LineBasicMaterial({color:0x42617e,transparent:true,opacity:.5})
);
edges.position.set(SIZE/2,SIZE/2,SIZE/2);
scene.add(edges);

const cube=new THREE.BoxGeometry(1,1,1);
const materials=palette.map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.05}));
const meshes=materials.map(m=>{
const mesh=new THREE.InstancedMesh(cube,m,1024);
mesh.count=0;
mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(mesh);
return mesh;
});

const dummy=new THREE.Object3D();
const cells=new Map();
const antMeshes=new Map();
let ants=[];
let socket=null;
let myId=null;
let myTag="...";
let isDriver=false;
let connected=false;
let moves=0;
let voxelCount=0;
let stopped=false;
let lastTick=0;
let tickTimer=0;

const status=document.getElementById("status");
const tagEl=document.getElementById("tag");
const stats=document.getElementById("stats");
const speed=document.getElementById("speed");
const speedvalue=document.getElementById("speedvalue");
const messages=document.getElementById("messages");
const chat=document.getElementById("chat");

function key(x,y,z){
return x+SIZE*(y+SIZE*z);
}

function coords(k){
const x=k%SIZE;
const y=Math.floor(k/SIZE)%SIZE;
const z=Math.floor(k/(SIZE*SIZE));
return{x,y,z};
}

function setCell(k,color){
cells.set(Number(k),Number(color)%COLORS);
}

function renderCells(){
const grouped=Array.from({length:COLORS},()=>[]);
for(const [k,c] of cells){
grouped[c].push(k);
}
for(let c=0;c<COLORS;c++){
const list=grouped[c];
const mesh=meshes[c];
if(list.length>mesh.instanceMatrix.count){
let capacity=Math.max(1024,mesh.instanceMatrix.count);
while(capacity<list.length)capacity*=2;
mesh.dispose();
const replacement=new THREE.InstancedMesh(cube,materials[c],capacity);
replacement.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.remove(mesh);
meshes[c]=replacement;
scene.add(replacement);
}
const target=meshes[c];
target.count=list.length;
for(let i=0;i<list.length;i++){
const p=coords(list[i]);
dummy.position.set(p.x+.5,p.y+.5,p.z+.5);
dummy.updateMatrix();
target.setMatrixAt(i,dummy.matrix);
}
target.instanceMatrix.needsUpdate=true;
target.computeBoundingSphere();
}
voxelCount=cells.size;
}

function updateAnts(list){
ants=list||[];
const keep=new Set();
for(const ant of ants){
const id=ant.id;
if(!id)continue;
keep.add(id);
let mesh=antMeshes.get(id);
if(!mesh){
mesh=new THREE.Mesh(
new THREE.SphereGeometry(.65,12,10),
new THREE.MeshStandardMaterial({color:palette[ant.color%COLORS],emissive:palette[ant.color%COLORS],emissiveIntensity:.3})
);
scene.add(mesh);
antMeshes.set(id,mesh);
}
mesh.position.set(ant.x+.5,ant.y+.5,ant.z+.5);
mesh.material.color.setHex(palette[(ant.color||0)%COLORS]);
mesh.material.emissive.setHex(palette[(ant.color||0)%COLORS]);
}
for(const [id,mesh] of antMeshes){
if(!keep.has(id)){
scene.remove(mesh);
mesh.geometry.dispose();
mesh.material.dispose();
antMeshes.delete(id);
}
}
stats.textContent=`MOVES: ${moves.toLocaleString()} | VOXELS: ${voxelCount.toLocaleString()} | ANTS: ${ants.length}`;
}

function send(data){
if(socket&&socket.readyState===WebSocket.OPEN){
socket.send(JSON.stringify(data));
}
}

function addMessage(tag,message,system=false){
const div=document.createElement("div");
div.className=system?"msg system":"msg";
if(system){
div.textContent=message;
}else{
const who=document.createElement("span");
who.className="who";
who.textContent=tag+" ";
const body=document.createElement("span");
body.textContent=message;
div.append(who,body);
}
messages.appendChild(div);
while(messages.children.length>60)messages.firstChild.remove();
messages.scrollTop=messages.scrollHeight;
}

function connect(){
const room=(location.hash.slice(1)||Math.random().toString(36).slice(2,8)).toUpperCase();
if(!location.hash)location.hash=room;
status.textContent="CONNECTING · "+room;
socket=new WebSocket(`wss://${location.host}/room/${room}`);

socket.onopen=()=>{
connected=true;
status.textContent="CONNECTED · "+room;
};

socket.onmessage=event=>{
let data;
try{data=JSON.parse(event.data)}catch{return}

if(data.type==="welcome"){
myId=data.id;
myTag=data.tag||"UNKNOWN";
tagEl.textContent="TAG: "+myTag;
cells.clear();
for(const v of data.cells||[])setCell(v[0],v[1]);
renderCells();
moves=data.moves||0;
updateAnts(data.ants||[]);
isDriver=!!data.driver;
for(const item of data.chat||[]){
addMessage(item.tag,item.message);
}
status.textContent="CONNECTED · "+room+(isDriver?" · DRIVER":"");
}

if(data.type==="update"){
for(const v of data.cells||[])setCell(v[0],v[1]);
renderCells();
moves=data.moves||moves;
if(data.ants)updateAnts(data.ants);
else stats.textContent=`MOVES: ${moves.toLocaleString()} | VOXELS: ${cells.size.toLocaleString()} | ANTS: ${ants.length}`;
}

if(data.type==="ants"){
updateAnts(data.ants||[]);
}

if(data.type==="driver"){
isDriver=!!data.driver;
status.textContent="CONNECTED · "+room+(isDriver?" · DRIVER":"");
}

if(data.type==="chat"){
addMessage(data.tag,data.message);
}

if(data.type==="system"){
addMessage("",data.message,true);
}

if(data.type==="reset"){
cells.clear();
renderCells();
moves=0;
if(data.ants)updateAnts(data.ants);
}
};

socket.onclose=()=>{
connected=false;
status.textContent="DISCONNECTED";
};

socket.onerror=()=>{
status.textContent="CONNECTION ERROR";
};
}

function tick(){
if(!connected||!isDriver||stopped)return;
const now=performance.now();
const amount=Number(speed.value);
const delay=Math.max(1,1000/amount);
if(now-lastTick>=delay){
lastTick=now;
send({type:"tick",count:1});
}
}

function animate(){
requestAnimationFrame(animate);
controls.update();
tick();
renderer.render(scene,camera);
}
animate();

speed.addEventListener("input",()=>{
speedvalue.textContent=speed.value;
});

document.getElementById("invite").onclick=async()=>{
try{
await navigator.clipboard.writeText(location.href);
document.getElementById("invite").textContent="COPIED!";
setTimeout(()=>document.getElementById("invite").textContent="INVITE",1200);
}catch{
prompt("Copy room link:",location.href);
}
};

document.getElementById("leave").onclick=()=>{
stopped=true;
if(socket)socket.close();
status.textContent="LEFT ROOM";
};

document.getElementById("reset").onclick=()=>{
if(isDriver)send({type:"reset"});
};

document.getElementById("center").onclick=()=>{
camera.position.set(170,150,190);
controls.target.set(SIZE/2,SIZE/2,SIZE/2);
controls.update();
};

document.getElementById("mobilechat").onclick=()=>{
chat.classList.toggle("open");
};

document.getElementById("chatform").addEventListener("submit",event=>{
event.preventDefault();
const input=document.getElementById("chatinput");
const message=input.value.trim();
if(!message)return;
send({type:"chat",message});
input.value="";
});

addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

connect();
</script>
</body>
 </html>
